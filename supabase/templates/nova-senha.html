<!-- Assunto: Criar uma senha nova no Facas Desenvolvimento -->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;color:#14181D">
  <h2 style="font-size:20px">Senha nova</h2>
  <p>Recebemos um pedido para trocar a senha desta conta. O link vale por 1 hora.</p>
  <p><a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=recovery" style="display:inline-block;background:#0E5E57;color:#fff;padding:12px 20px;border-radius:6px;text-decoration:none;font-weight:bold">Criar senha nova</a></p>
  <p style="color:#525C68;font-size:13px">Não pediu? Ignore este e-mail; a senha atual continua valendo.</p>
</div>
