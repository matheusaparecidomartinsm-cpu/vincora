  <p>Você criou uma conta no Vincora com este endereço. Clique no botão para confirmar e entrar.</p>
  <p><a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=signup&next=/" style="display:inline-block;background:#0E5E57;color:#fff;padding:12px 20px;border-radius:6px;text-decoration:none;font-weight:bold">Confirmar e entrar</a></p>
